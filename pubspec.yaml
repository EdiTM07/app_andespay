name: app_banco
description: "SmartBank EC - Aplicación bancaria móvil"
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.0.0
  firebase_auth: ^5.0.0
  cloud_firestore: ^5.0.0
  google_sign_in: ^6.2.2

  # Gestión de estado
  provider: ^6.1.2

  # Navegación
  go_router: ^15.1.2

  # Seguridad
  crypto: ^3.0.5

  # Utilidades
  uuid: ^4.5.1

  # UI
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  intl: ^0.19.0

  # QR
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.2.3


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/img/
    - assets/img/onboarding/
    - assets/icons/

